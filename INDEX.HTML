<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <!--wrapper!-->
    <div class="w-[100vw] h-[100vh] flex flex-col items-center justify-center  bg-gray-500 gap-10">
       <!--Heading-->
            <div class="text-[#0398d4] font-medium text-[20px]">increment and Decrement</div>

            <div class="flex  bg-white  rounded-sm  text-[25px] text-[#344151] gap-10 p-5  px-5">
               
                <!--positive button-->
                <button onclick="increment()" class="border-r-2 border-[#bfbfbf] pl-5">+<i class="fa-solid  fa-plus"></i> </button>
                       </button>

                <div id="counter" class="font-bold">0</div>

<!--negative buttton-->
                <button onclick="decrement()" class="border-l-2 border-[#bfbfbf] pl-5">-
                    <i class="fa-solid fa-minus"></i>
                </button>

            </div>
        </div>
    </div>
    <script src="app.js"></script>
    <script src="https://kit.fontawesome.com/58a81065e.js" crossorigin="anonymous"></script>
</body>
</html>
